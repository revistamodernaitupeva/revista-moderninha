name: Vigia do token
on:
  schedule:
    - cron: "23 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testar o token da Meta
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, sys, urllib.request, urllib.error
          cfg = json.load(open("config.json"))
          url = (f"https://graph.facebook.com/{cfg['versao_api']}/"
                 f"{cfg['instagram_id']}/content_publishing_limit"
                 "?fields=quota_usage,config")
          req = urllib.request.Request(
              url, headers={"Authorization": "Bearer " + os.environ["META_TOKEN"]})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("Token OK:", r.read().decode())
          except urllib.error.HTTPError as e:
              print("TOKEN COM PROBLEMA:", e.read().decode())
              sys.exit(1)
          PY

      - name: Registrar atividade
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > ultima-verificacao.txt
          git config user.name "publicador-bot"
          git config user.email "publicador-bot@users.noreply.github.com"
          git add ultima-verificacao.txt
          git commit -m "Vigia: token verificado" || echo "Nada a registrar."
          git pull --rebase
          git push
